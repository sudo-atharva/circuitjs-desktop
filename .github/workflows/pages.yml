name: Publish web simulator + circuit gallery (GitHub Pages)

# The site (docs/site): index.html = home, gallery.html = everyday circuits (screenshots in docs/gallery),
# guide.html = guide & tips, circuitjs.html = the simulator; gallery cards open circuits live with
# circuitjs.html?startCircuit=<file>. Images for the pages: docs/*.png -> img/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java to JS (GWT)
        run: |
          curl -sSL -o gwt.zip https://github.com/gwtproject/gwt/releases/download/2.12.2/gwt-2.12.2.zip
          unzip -q gwt.zip
          java -Xmx2g -cp "src:gwt-2.12.2/gwt-user.jar:gwt-2.12.2/gwt-dev.jar" \
            com.google.gwt.dev.Compiler -war war -sourceLevel 1.8 \
            com.lushprojects.circuitjs1.circuitjs1

      - name: Assemble site
        run: |
          mkdir -p _site/gallery
          cp -r war/* _site/
          rm -rf _site/WEB-INF _site/shortrelay.php
          mkdir -p _site/img
          cp docs/site/* _site/
          cp docs/gallery/*.png _site/gallery/
          cp docs/*.png _site/img/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
